name: Execution visibility validation

on:
  push:
    branches: [feat/execution-visibility]
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/src/auth/**"
      - "apps/api/test/**"
      - "tests/portal/**"
      - "tests/jest.portal.config.cjs"
      - "apps/api/src/workflows/**"
      - "packages/workflows/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/execution-visibility.yml"

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: portal-ci-password
          POSTGRES_DB: plataforma_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plataforma_portal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.4.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build internal packages
        run: |
          pnpm --filter @plataforma/database build
          pnpm --filter @plataforma/auth build
          pnpm --filter @plataforma/workflows build
      - name: Check workflow tests
        run: pnpm --filter @plataforma/api test -- workflows.service.spec.ts workflows.visibility.spec.ts workflows.controller.spec.ts
      - name: Check authentication tests
        run: pnpm --filter @plataforma/api test -- auth-token.service.spec.ts jwt.strategy.spec.ts auth-session.http.spec.ts
      - name: Check portal request lifecycle
        run: pnpm --filter @plataforma/api exec jest --config ../../tests/jest.portal.config.cjs --runInBand
      - name: Build API
        run: pnpm --filter @plataforma/api build
      - name: Check portal types
        run: pnpm --filter @plataforma/web lint
      - name: Build portal
        run: pnpm --filter @plataforma/web build
      - name: Validate portal with PostgreSQL and Chrome
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:portal-ci-password@127.0.0.1:5432/plataforma_portal_ci?schema=public
          PORTAL_TEST_DATABASE_URL: postgresql://postgres:portal-ci-password@127.0.0.1:5432/plataforma_portal_ci?schema=public
          JWT_SECRET: portal-ci-access-secret
          JWT_REFRESH_SECRET: portal-ci-refresh-secret
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PORTAL_QA_ARTIFACT_DIR: ${{ runner.temp }}/portal-qa
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          test -n "$CHROME_BIN"
          pnpm --filter @plataforma/database exec prisma db push --skip-generate
          pnpm --filter @plataforma/api exec jest --config test/jest-portal-e2e.cjs --runInBand
      - name: Preserve portal inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-qa
          path: ${{ runner.temp }}/portal-qa
          if-no-files-found: ignore
